<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>APPINOX — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="auth-wrapper">
    <!-- Logo -->
    <a href="/login" class="auth-logo">
      <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" class="auth-icon">
        <defs>
          <linearGradient id="g1" x1="75%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#c8f2ff"/>
            <stop offset="20%" style="stop-color:#33ddff"/>
            <stop offset="65%" style="stop-color:#0099ee"/>
            <stop offset="100%" style="stop-color:#0055bb"/>
          </linearGradient>
          <linearGradient id="g1b" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0077bb"/><stop offset="100%" style="stop-color:#004488"/>
          </linearGradient>
          <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#8800ee"/>
            <stop offset="55%" style="stop-color:#cc00ff"/>
            <stop offset="100%" style="stop-color:#ff0066"/>
          </linearGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="garrw"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <!-- Right dark face -->
        <polygon points="40,7 74,73 56,73 40,36" fill="#0e0038" stroke="rgba(60,60,180,0.15)" stroke-width="0.5"/>
        <!-- Left bright face -->
        <polygon points="40,7 6,73 24,73 40,36" fill="url(#g1)" filter="url(#glow)"/>
        <line x1="40" y1="7" x2="24" y2="73" stroke="rgba(160,235,255,0.3)" stroke-width="1"/>
        <!-- Crossbar -->
        <polygon points="15,55 62,55 58,44 19,44" fill="url(#g1b)" opacity="0.9"/>
        <!-- Arrow shaft -->
        <line x1="28" y1="72" x2="64" y2="6" stroke="url(#g2)" stroke-width="9" stroke-linecap="round" filter="url(#garrw)"/>
        <!-- Arrow head -->
        <polygon points="64,6 46,15 56,32" fill="#ff0066" filter="url(#garrw)"/>
        <polygon points="64,6 48,12 55,24" fill="#ff99cc" opacity="0.55"/>
      </svg>
      <span class="auth-wordmark">APPINOX</span>
    </a>

    <!-- Card -->
    <div class="auth-card">
      <h1 class="auth-title">Connexion</h1>
      <p class="auth-subtitle">Accédez à votre espace APPINOX</p>

      <div id="error-msg" class="error-banner" style="display:none"></div>

      <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
        <div class="field-group">
          <label class="field-label">Adresse email</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            <input type="email" id="email" class="field-input" placeholder="votre@email.com" required autocomplete="email"/>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Mot de passe</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" class="field-input" placeholder="••••••••" required autocomplete="current-password"/>
            <button type="button" class="eye-btn" onclick="togglePwd('password', this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="field-row">
          <label class="checkbox-wrap">
            <input type="checkbox" id="remember"/>
            <span class="checkbox-custom"></span>
            <span>Se souvenir de moi</span>
          </label>
          <a href="#" class="link-dim">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          <span id="btn-text">Se connecter</span>
          <div id="btn-spinner" class="spinner" style="display:none"></div>
        </button>
      </form>

      <div class="auth-divider"><span>ou</span></div>

      <p class="auth-switch">
        Pas encore de compte ?
        <a href="/register" class="link-accent">Créer un compte</a>
      </p>
    </div>

    <p class="auth-footer">© 2026 APPINOX</p>
  </div>

  <script src="auth.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');
      const errDiv = document.getElementById('error-msg');

      btn.disabled = true;
      btnText.style.display = 'none';
      spinner.style.display = 'block';
      errDiv.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur de connexion');
        window.location.href = '/';
      } catch (err) {
        errDiv.textContent = err.message;
        errDiv.style.display = 'flex';
        btn.disabled = false;
        btnText.style.display = 'block';
        spinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
