<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>APPINOX — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="auth-wrapper">
    <!-- Logo -->
    <a href="/login" class="auth-logo">
      <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" class="auth-icon">
        <defs>
          <linearGradient id="g1" x1="70%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#bbf0ff"/>
            <stop offset="25%" stop-color="#22ccff"/>
            <stop offset="65%" stop-color="#0088ee"/>
            <stop offset="100%" stop-color="#0050aa"/>
          </linearGradient>
          <linearGradient id="g1r" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1c0065"/><stop offset="100%" stop-color="#090030"/>
          </linearGradient>
          <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7700cc"/>
            <stop offset="50%" stop-color="#cc00ff"/>
            <stop offset="100%" stop-color="#ff0066"/>
          </linearGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="garrw"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <polygon points="40,35 23,75 57,75" fill="#0a4580"/>
        <polygon points="40,7 75,75 57,75 40,35" fill="url(#g1r)"/>
        <polygon points="40,7 5,75 23,75 40,35" fill="url(#g1)" filter="url(#glow)"/>
        <polygon points="40,7 40,33 23,75 5,75" fill="#33aaff" opacity="0.11"/>
        <line x1="40" y1="7" x2="23" y2="75" stroke="rgba(180,240,255,0.35)" stroke-width="0.9"/>
        <polygon points="17,53 63,53 65,44 15,44" fill="#0a4580" opacity="0.93"/>
        <line x1="27" y1="73" x2="65" y2="6" stroke="url(#g2)" stroke-width="8.5" stroke-linecap="round" filter="url(#garrw)"/>
        <polygon points="65,6 47,16 55,32" fill="#ff0066" filter="url(#garrw)"/>
        <polygon points="65,6 41,19 47,16" fill="#cc00ff" opacity="0.88"/>
        <polygon points="65,6 49,13 54,23" fill="#ff88cc" opacity="0.5"/>
      </svg>
      <span class="auth-wordmark">APPINOX</span>
    </a>

    <!-- Card -->
    <div class="auth-card">
      <h1 class="auth-title">Connexion</h1>
      <p class="auth-subtitle">Accédez à votre espace APPINOX</p>

      <div id="error-msg" class="error-banner" style="display:none"></div>

      <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
        <div class="field-group">
          <label class="field-label">Adresse email</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            <input type="email" id="email" class="field-input" placeholder="votre@email.com" required autocomplete="email"/>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Mot de passe</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" class="field-input" placeholder="••••••••" required autocomplete="current-password"/>
            <button type="button" class="eye-btn" onclick="togglePwd('password', this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="field-row">
          <label class="checkbox-wrap">
            <input type="checkbox" id="remember"/>
            <span class="checkbox-custom"></span>
            <span>Se souvenir de moi</span>
          </label>
          <a href="#" class="link-dim">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          <span id="btn-text">Se connecter</span>
          <div id="btn-spinner" class="spinner" style="display:none"></div>
        </button>
      </form>

      <div class="auth-divider"><span>ou</span></div>

      <p class="auth-switch">
        Pas encore de compte ?
        <a href="/register" class="link-accent">Créer un compte</a>
      </p>
    </div>

    <p class="auth-footer">© 2026 APPINOX</p>
  </div>

  <script src="auth.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');
      const errDiv = document.getElementById('error-msg');

      btn.disabled = true;
      btnText.style.display = 'none';
      spinner.style.display = 'block';
      errDiv.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur de connexion');
        window.location.href = '/';
      } catch (err) {
        errDiv.textContent = err.message;
        errDiv.style.display = 'flex';
        btn.disabled = false;
        btnText.style.display = 'block';
        spinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
