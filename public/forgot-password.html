<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>APPINOX — Mot de passe oublié</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="auth-wrapper">
    <a href="/login" class="auth-logo">
      <img src="/logo.png" class="auth-icon-img" alt="APPINOX"/>
      <span class="auth-wordmark">APPINOX</span>
    </a>

    <div class="auth-card">
      <h1 class="auth-title">Mot de passe oublié</h1>
      <p class="auth-subtitle">Entrez votre email et votre code secret pour réinitialiser</p>

      <div id="error-msg" class="error-banner" style="display:none"></div>
      <div id="success-msg" class="success-banner" style="display:none"></div>

      <!-- Step 1: email + secret code + new password -->
      <div id="step-form">
        <form id="forgot-form" class="auth-form" onsubmit="handleForgot(event)">
          <div class="field-group">
            <label class="field-label">Adresse email</label>
            <div class="field-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
              </svg>
              <input type="email" id="email" class="field-input" placeholder="votre@email.com" required autocomplete="email"/>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">Code secret</label>
            <div class="field-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="text" id="secret-code" class="field-input" placeholder="Votre code secret" required autocomplete="off"/>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">Nouveau mot de passe</label>
            <div class="field-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
              <input type="password" id="new-password" class="field-input" placeholder="Min. 6 caractères" required autocomplete="new-password" oninput="checkStrength(this.value)"/>
              <button type="button" class="eye-btn" onclick="togglePwd('new-password', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <span class="strength-label" id="strength-label"></span>
          </div>

          <button type="submit" class="btn-submit" id="submit-btn">
            <span id="btn-text">Réinitialiser le mot de passe</span>
            <div id="btn-spinner" class="spinner" style="display:none"></div>
          </button>
        </form>
      </div>

      <div class="auth-divider"><span>ou</span></div>
      <p class="auth-switch">
        <a href="/login" class="link-accent">Retour à la connexion</a>
      </p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    function checkStrength(pwd) {
      const fill = document.getElementById('strength-fill');
      const label = document.getElementById('strength-label');
      let score = 0;
      if (pwd.length >= 6) score++;
      if (pwd.length >= 10) score++;
      if (/[A-Z]/.test(pwd)) score++;
      if (/[0-9]/.test(pwd)) score++;
      if (/[^A-Za-z0-9]/.test(pwd)) score++;
      const levels = [
        { w: '0%', color: 'transparent', text: '' },
        { w: '25%', color: '#ff2d78', text: 'Très faible' },
        { w: '50%', color: '#ff8c00', text: 'Faible' },
        { w: '75%', color: '#ffd700', text: 'Moyen' },
        { w: '90%', color: '#00d4ff', text: 'Fort' },
        { w: '100%', color: '#00ff88', text: 'Très fort' },
      ];
      const l = levels[Math.min(score, 5)];
      fill.style.width = l.w; fill.style.background = l.color;
      label.textContent = l.text; label.style.color = l.color;
    }

    async function handleForgot(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');
      const errDiv = document.getElementById('error-msg');
      const successDiv = document.getElementById('success-msg');

      btn.disabled = true; btnText.style.display = 'none'; spinner.style.display = 'block';
      errDiv.style.display = 'none'; successDiv.style.display = 'none';

      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            secretCode: document.getElementById('secret-code').value,
            newPassword: document.getElementById('new-password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur');
        successDiv.innerHTML = '✓ Mot de passe réinitialisé ! Redirection…';
        successDiv.style.display = 'flex';
        document.getElementById('forgot-form').style.display = 'none';
        setTimeout(() => window.location.href = '/login', 2000);
      } catch (err) {
        errDiv.textContent = err.message;
        errDiv.style.display = 'flex';
        btn.disabled = false; btnText.style.display = 'block'; spinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
